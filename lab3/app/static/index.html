<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛираТех · База знаний</title>
<style>
:root{font:15px/1.55 system-ui,sans-serif;color:#213a31;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}header{background:#173f32;color:white;padding:25px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;font-weight:600;margin:0}header small{color:#c5d7ce}main{max-width:1230px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:260px 1fr;gap:32px}aside{font-size:14px}aside details{padding:7px 0}summary{cursor:pointer;font-weight:600}aside a{display:block;padding:5px 6px;font-size:13px}a{color:#176649;text-decoration:none}a:hover{text-decoration:underline}section.content{min-width:0}textarea{width:100%;min-height:105px;font:inherit;border:1px solid #b7c9be;border-radius:9px;padding:14px;background:white;resize:vertical}button,select{font:inherit;border:1px solid #b7c9be;border-radius:6px;padding:8px 14px;background:white;color:#234336;cursor:pointer}button.primary{background:#246b50;color:#fff;border-color:#246b50}button:disabled{opacity:.5;cursor:wait}.bar,.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}.filters{font-size:13px;color:#52685d}.filters select{font-size:13px;max-width:240px}label{display:flex;gap:5px;align-items:center}.card,.answer{background:white;border:1px solid #d8e1da;border-radius:9px;padding:18px;margin:14px 0}.card h3{margin:0 0 5px;font-size:17px}.meta,.hint{font-size:12px;color:#66796e}.badge{display:inline-block;border-radius:5px;background:#e1eee6;padding:3px 8px;font:12px ui-monospace,monospace;margin-right:7px}.answer-text{white-space:pre-wrap;margin:12px 0}.error{color:#a13930}.status{margin:12px 0;color:#50685c}#results:empty:after{content:'Найдите документ или задайте вопрос по базе знаний.';color:#76867d}.source{display:block;font-size:13px;padding:3px 0}.diagnostics{font-size:13px;margin:20px 0;color:#576e62}.diagnostics select{font-size:12px}h2{font-size:18px;font-weight:600}input[type=checkbox]{accent-color:#246b50}@media(max-width:740px){main{grid-template-columns:1fr;gap:12px}aside{border-bottom:1px solid #d8e1da;padding-bottom:12px}aside>details:not([open]){display:block}header{padding:20px 24px}header small{display:none}}
</style>
<header><div><small>ЛИРАТЕХ / ВНУТРЕННЯЯ БАЗА</small><h1>Найти. Понять. Проверить.</h1></div><small id="health">Подключение…</small></header>
<main><aside><details open><summary>Разделы и редакции</summary><div id="tree"></div></details></aside>
<section class="content"><textarea id="query" aria-label="Вопрос или поисковый запрос" placeholder="Почему комитет отложил расширение пилота?"></textarea>
<div class="filters"><select id="path" aria-label="Раздел"><option value="">Все разделы</option></select><label><input id="archive" type="checkbox">Архив</label><label><input id="draft" type="checkbox">Черновики</label><label><input id="private" type="checkbox">Только локально</label></div>
<div class="bar"><button id="search">Найти документы</button><button id="ask" class="primary">Спросить по базе</button></div>
<details class="diagnostics" id="diagnostics" hidden><summary>Проверка переключения</summary><p>Синтетический облачный имитатор. Реальный ключ и платные запросы не используются.</p><select id="fault" aria-label="Сценарий проверки"><option value="live">Обычный маршрут</option><option value="ok">Имитатор: успех</option><option value="429">Имитатор: 429</option><option value="quota">Имитатор: квота исчерпана</option><option value="503">Имитатор: 503</option><option value="timeout">Имитатор: таймаут</option><option value="invalid_citations">Имитатор: неверные ссылки</option><option value="both_down">Обе модели недоступны</option></select></details>
<div id="status" class="status" role="status"></div><div id="answer"></div><div id="results"></div></section></main>
<script>
const $=id=>document.getElementById(id);const node=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(95000)});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Проверьте запрос и выбранные фильтры');return data}
function link(text,url,cls){const a=node('a',text,cls);a.href=url;return a}
function cards(items){$('results').replaceChildren();for(const c of items){const card=node('article',undefined,'card');const heading=node('h3');heading.append(link(c.title,c.url));card.append(heading,node('div',`${c.id}@${c.version} · ${c.status} · ${c.path.join(' / ')}`,'meta'));for(const s of c.snippets.slice(0,1))card.append(node('p',s.text));$('results').append(card)}}
async function run(ask){$('status').className='status';$('status').textContent=ask?'Ищу источники и готовлю ответ. CPU-модели может потребоваться до 75 секунд…':'Ищу документы…';$('search').disabled=$('ask').disabled=true;$('answer').replaceChildren();try{const body={query:$('query').value,statuses:['Действует',...($('archive').checked?['Архив']:[]),...($('draft').checked?['Черновик']:[])],private:$('private').checked,fault:$('fault').value};if($('path').value)body.path=JSON.parse($('path').value);const d=await api(ask?'/api/ask':'/api/search',body);cards(d.cards);if(ask){const panel=node('article',undefined,'answer');panel.append(node('span',d.route,'badge'),node('span',(d.provider||'найденные документы')+(d.answer_mode==='extractive'?' · выбранные моделью цитаты':''),'meta'),node('div',d.answer,'answer-text'));for(const s of d.sources)panel.append(link(`[${s.number}] ${s.title} · ${s.doc_id}@${s.version} · ${s.status} · ${s.anchor}`,s.url,'source'));panel.append(node('p',`Причина: ${d.reason} · MCP / cloud / local: ${d.calls.mcp} / ${d.calls.cloud} / ${d.calls.local} · ${Math.round(d.timings_ms.total||0)} мс · ${d.request_id}`,'meta'));$('answer').append(panel)}$('status').textContent=`Найдено документов: ${d.cards.length}`;}catch(e){$('status').className='status error';$('status').textContent=e.message}finally{$('search').disabled=$('ask').disabled=false}}
$('search').onclick=()=>run(false);$('ask').onclick=()=>run(true);$('query').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run(true)}};
async function init(){try{const h=await api('/health');$('health').textContent=h.cloud_configured?'llm7.io → CPU-резерв':'Ollama CPU · облачный ключ не настроен';$('diagnostics').hidden=!h.synthetic_tests;const d=await api('/api/sections');for(const section of d.sections){const root=node('details'),title=node('summary',section.title);root.append(title);for(const sub of section.subsections){const child=node('details');child.append(node('summary',sub.title));for(const doc of sub.documents)child.append(link(`${doc.id}@${doc.version} · ${doc.title} [${doc.status}]`,doc.url));root.append(child);const option=node('option',section.title+' / '+sub.title);option.value=JSON.stringify(sub.path);$('path').append(option)}$('tree').append(root)}}catch(e){$('status').textContent=e.message;$('status').className='status error'}}init();
</script></html>
