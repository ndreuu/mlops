name: Lab 2 · Search CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'lab2/**'
      - '!lab2/README.md'
      - '!lab2/evidence/**'
      - '.github/workflows/lab2.yml'
  pull_request:
    paths: ['lab2/**', '.github/workflows/lab2.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oleinikov-search-delivery
  cancel-in-progress: false

env:
  HELM_DRIVER: configmap
  KUBE_NAMESPACE: itmo-student-13
  IMAGE_REPOSITORY: docker.io/ndreuu/oleinikov-iris

defaults:
  run:
    shell: bash
    working-directory: lab2

jobs:
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/build_index.py --output artifacts
      - run: pytest -q
      - name: Quality gate
        run: |
          mkdir -p reports
          python scripts/evaluate.py --artifact-dir artifacts | tee reports/quality.json
      - name: Negative quality control
        run: |
          set +e
          python scripts/evaluate.py --artifact-dir artifacts --ranking-mode reverse > reports/quality-reverse.json 2> reports/quality-reverse.log
          status=$?
          set -e
          cat reports/quality-reverse.json reports/quality-reverse.log
          echo "reverse exit_code=$status"
          test "$status" -ne 0
          python -c 'import json; r=json.load(open("reports/quality-reverse.json")); assert r["ranking_mode"]=="reverse" and (r["mrr"]<0.85 or r["recall_at_3"]<0.90)'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Helm validation
        run: |
          digest="sha256:$(printf '0%.0s' {1..64})"
          helm lint helm/mlops-search --set-string "image.digest=$digest"
          helm template oleinikov-search-staging helm/mlops-search -n "$KUBE_NAMESPACE" --set-string "image.digest=$digest" > reports/rendered.yaml
          if helm template invalid helm/mlops-search > reports/empty-digest.log 2>&1; then exit 1; fi
          if helm template invalid helm/mlops-search --set image.digest=sha256:bad > reports/invalid-digest.log 2>&1; then exit 1; fi
          cat reports/empty-digest.log reports/invalid-digest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-quality
          path: |
            lab2/artifacts/metadata.json
            lab2/reports/

  build:
    if: github.event_name != 'pull_request'
    needs: test-quality
    runs-on: ubuntu-latest
    environment: registry
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ndreuu
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: lab2
          push: true
          tags: docker.io/ndreuu/oleinikov-iris:search-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ndreuu/mlops
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Resolve digest and verify public pull
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p reports
          python scripts/check_registry.py "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" | tee reports/registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-registry
          path: lab2/reports/registry.json

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/lab2-kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/lab2-kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/lab2-kube/config" >> "$GITHUB_ENV"
      - name: Deploy staging and semantic smoke
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: bash scripts/deploy.sh oleinikov-search-staging staging "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-delivery
          path: lab2/reports/

  promote-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4
      - name: Configure Kubernetes
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/lab2-kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/lab2-kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/lab2-kube/config" >> "$GITHUB_ENV"
      - name: Promote the staging digest
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: bash scripts/deploy.sh oleinikov-search-prod production "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$GITHUB_SHA"
      - name: Bad release and semantic rollback
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: bash scripts/deploy.sh oleinikov-search-prod production "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$GITHUB_SHA" reverse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-delivery
          path: lab2/reports/
